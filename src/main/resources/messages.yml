# ZoneReplica 訊息檔：聊天訊息、介面標題、物品名稱與說明全部可在這裡修改
# 支援 & 顏色碼與 &#RRGGBB 十六進位色碼；聊天訊息會自動加上 config.yml 的 prefix
# 把某則聊天訊息設為 '' 即不送出
# 新版本加入的訊息會在啟動與 /zr reload 時自動補上，原有的文字會保留（舊檔備份為 messages.yml.bak）
# 請勿修改 messages-version
messages-version: 1

# ===== 一般 =====
no-permission: '&c你沒有權限執行此指令'
player-only: '&c此指令只能由玩家執行'
unknown-subcommand: '&c未知的子指令，輸入 &e/{label} help &c查看說明'
usage: '&c用法：&e{usage}'
reload-done: '&a已重新載入 config.yml 與 messages.yml'
invalid-name: '&c名稱只能使用中文、英文、數字、底線與連字號（不可用連字號開頭），最長 32 字元'
sample-exists: '&c樣本 &e{sample} &c已存在，請改用 &e/zr edit {sample}'
sample-not-found: '&c找不到樣本 &e{sample}'
placement-exists: '&c場地 {target} &c已存在，請改用 &e/zr edit {sample} {placement}'
placement-not-found: '&c找不到場地 {target}'
world-not-loaded: '&c場地 {target} &c的世界 &e{world} &c尚未載入'
confirm-required: '&c此操作需要確認，請在指令後面加上 &e{flag}'
no-snapshot: '&c樣本 &b{sample} &c尚未記錄快照'
no-backup: '&c場地 {target} &c沒有可復原的備份'
no-placements: '&c樣本 &b{sample} &c還沒有任何場地'
placement-incomplete: '&c場地 {target} &c尚有未設定的項目：&e{missing}'
out-of-world: '&c場地 {target} &c的範圍超出世界高度'
draft-resumed: '&7已載入未儲存的暫存設定'

# ===== 列表（後台） =====
list-empty: '&7目前沒有任何樣本'
list-header: '&b樣本列表 &7（共 {count} 個）'
list-entry: '&f- &b{sample} &7世界 {world}，{size}，場地 {placements} 個，快照 {snapshot}'

# ===== 幫助 =====
help-header: '&b&lZoneReplica &7v{version} 指令說明'
help:
  root: '&e/{label} &7- 顯示版本並檢查更新'
  version: '&e/{label} version &7- 顯示版本並檢查更新'
  help: '&e/{label} help &7- 顯示這份說明'
  create: '&e/{label} create <樣本> &7- 建立新樣本'
  place: '&e/{label} place <樣本> <場地> &7- 設定新的覆蓋場地'
  update: '&e/{label} update <樣本> [場地] &7- 執行覆蓋（不指定場地時覆蓋全部）'
  edit: '&e/{label} edit <樣本> [場地] &7- 編輯樣本或場地'
  del: '&e/{label} del <樣本> [場地] &7- 刪除樣本（連同場地）或場地'
  undo: '&e/{label} undo <樣本> <場地> &7- 復原最近一次覆蓋'
  cancel: '&e/{label} cancel <樣本> [場地] &7- 中止進行中或排隊中的任務'
  schedule: '&e/{label} schedule [樣本] [場地] &7- 查看覆蓋進度'
  list: '&e/{label} list &7- 樣本列表'
  reload: '&e/{label} reload &7- 重新載入設定與訊息'
  flags: '&7後台與指令方塊可加參數：&e-queue &7排隊、&e-force &7中斷目前工作後執行、&e-confirm &7確認刪除或復原'
usage-of:
  create: '/{label} create <樣本>'
  place: '/{label} place <樣本> <場地>'
  update: '/{label} update <樣本> [場地] [-queue|-force]'
  edit: '/{label} edit <樣本> [場地]'
  del: '/{label} del <樣本> [場地] [-confirm]'
  undo: '/{label} undo <樣本> <場地> [-confirm] [-queue|-force]'
  cancel: '/{label} cancel <樣本> [場地]'

